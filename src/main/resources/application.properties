spring.datasource.url=jdbc:postgresql://localhost:5432/tariki_db
spring.datasource.username=tariki
spring.datasource.password=tariki
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Data initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# JWT: replace the development fallback with the JWT_SECRET environment variable in production.
app.jwt.secret=${JWT_SECRET:lDqsJ4R40VubUPApJilFsE+nVTs5kWA2cytNakhqpHo=}
app.jwt.access-token-expiration=3600000
app.chat.encryption-key=${CHAT_ENCRYPTION_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.navigation.osrm-url=${NAVIGATION_OSRM_URL:https://routing.openstreetmap.de/routed-car}
app.navigation.user-agent=${NAVIGATION_USER_AGENT:Tariki/1.0 delivery-navigation}
